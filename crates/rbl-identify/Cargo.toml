[package]
name = "rbl-identify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Track identification: Chromaprint fingerprints, AcoustID and MusicBrainz lookups, candidate scoring. Fork-only; see docs/identify/IDENTIFY_SPEC.md."

[lints]
workspace = true

[dependencies]
rbl-audio = { path = "../rbl-audio" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Pure-Rust Chromaprint: no fpcalc or FFmpeg to ship.
rusty-chromaprint = "0.3"
# AcoustID takes the compressed fingerprint as unpadded URL-safe base64.
# Already in the lock through other crates.
base64 = "0.22"
# The blocking client: identification runs on a worker thread, as every
# rbxport command does (commands::blocking), so no async plumbing is needed.
# rustls rather than native-tls, which would pull a second OpenSSL beside
# SQLCipher's vendored one. Already in the lock through sentry.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
