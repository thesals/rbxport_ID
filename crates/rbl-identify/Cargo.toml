[package]
name = "rbl-identify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Track identification: Chromaprint fingerprints, AcoustID and MusicBrainz lookups, candidate scoring. Fork-only; see docs/identify/IDENTIFY_SPEC.md."

[lints]
workspace = true

[dependencies]
rbl-audio = { path = "../rbl-audio" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Pure-Rust Chromaprint: no fpcalc or FFmpeg to ship.
rusty-chromaprint = "0.3"
# AcoustID takes the compressed fingerprint as unpadded URL-safe base64.
# Already in the lock through other crates.
base64 = "0.22"
# The blocking client: identification runs on a worker thread, as every
# rbxport command does (commands::blocking), so no async plumbing is needed.
# rustls rather than native-tls, which would pull a second OpenSSL beside
# SQLCipher's vendored one. Already in the lock through sentry.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Reading the file's own tags and true duration (writing comes in Phase 4).
# The version rbl-db already uses.
lofty = { version = "0.22", default-features = false }
# NFKD decomposition to fold accents when comparing names. Already in the
# lock through rbl-export and rbl-nfs.
unicode-normalization = "0.1"
# The identify store: this feature's own SQLite file (never rekordbox's
# master.db). Exactly the variant every other workspace crate builds, so no
# second SQLite is compiled; no key is ever set, so the file is plain SQLite.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# SHA-256 of fetched artwork, so the store keeps one copy per image.
# The 0.10.9 already in the lock.
sha2 = "0.10"

# The tag writer stages each file beside the original and renames it over.
tempfile = "3"

[dev-dependencies]
